[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yass-zz-de-multimodal_jd131"
version = "0.1.0"
description = "为每一项打分并与阈值比较，明确标出通过、边界与不通过三档"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "yass-zz-de" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://yass-zz-de.github.io"
Repository = "https://github.com/yass-zz-de/multimodal_jd131"
Issues = "https://github.com/yass-zz-de/multimodal_jd131/issues"

[project.scripts]
multimodal_jd131 = "multimodal_jd131:main"

[tool.setuptools]
py-modules = ["multimodal_jd131"]
